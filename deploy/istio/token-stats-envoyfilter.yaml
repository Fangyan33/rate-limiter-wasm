apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: token-stats
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      app: istio-ingressgateway
      istio: ai-gateway
  configPatches:
    - applyTo: EXTENSION_CONFIG
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: token-stats-wasm
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
            config:
              name: token-stats
              root_id: token-stats-root
              fail_open: true
              vm_config:
                vm_id: token-stats-vm
                runtime: envoy.wasm.runtime.v8
                nack_on_code_cache_miss: true
                code:
                  remote:
                    http_uri:
                      uri: http://counter-service.default.svc.cluster.local:8080/wasm/token-stats.wasm
                      cluster: counter-service
                      timeout: 10s
                    sha256: 9f6cd6a467bc33b5e924fb0ce928b6610995ae3436936f16a9ea33a42e78e9d1
              configuration:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: |
                  domains:
                    - llm-demo.local
                    - vllm-083.default.paic.com.cn
                  token_statistics:
                    enabled: true
                    inject_stream_usage: true
                    metric_key_limit: 5000
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: token-stats-wasm
          config_discovery:
            config_source:
              ads: {}
            apply_default_config_without_warming: true
            default_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              inline_code: "function envoy_on_request(handle) end"
            type_urls:
              - type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
              - type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
