# Wasm 只读取并发送原始路由目标，Counter Service 转换服务标识。
# 无需配置入口域名；额度通过 Counter Service 的 /config 接口管理：
# {"service":"default/nginx-file-server-svc","port":80,"api_key":"key001","max_concurrent":5,"enabled":true}
# service 只接受 namespace/name；port 是 Service port，不是 targetPort。
# api_key 省略或为空时，作为该服务端口的默认共享额度。
# enabled=false 或缺失规则跳过；调用、解析和依赖故障均放行。
# distributed_limit.enabled=false 直接透传，不执行本地限流。
distributed_limit:
  enabled: true
  backend: counter_service
  counter_service:
    cluster: counter-service
    acquire_path: /acquire
    release_path: /release
    renew_path: /renew
    timeout_ms: 5000
    lease_ttl_ms: 30000
error_response:
  status_code: 429
  message: Rate limit exceeded
