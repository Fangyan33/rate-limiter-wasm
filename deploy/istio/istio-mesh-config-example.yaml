# 已废弃：token-stats 停止维护，后续完整移除。此清单仅保留现状，不属于限流部署要求。
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: istio
    app.kubernetes.io/name: istio-mesh-config-example
# This file is a full ConfigMap-shaped example for Istio 1.13.x mesh config updates.
# Review and merge the data.mesh content into the live istio-system/istio ConfigMap.
# Do not blindly apply it to a running cluster unless you have first merged in your existing
# mesh settings, because replacing data.mesh wholesale can drop unrelated mesh configuration.
data:
  mesh: |-
    accessLogFile: /dev/stdout
    defaultConfig:
      extraStatTags:
        - domain
        - uid
    enablePrometheusMerge: true
    trustDomain: cluster.local
