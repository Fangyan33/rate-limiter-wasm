apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istio-ingressgateway-llm-metrics
  namespace: istio-system
  labels:
    app: istio-ingressgateway
spec:
  selector:
    matchLabels:
      app: istio-ingressgateway
  endpoints:
    - port: http-envoy-prom
      interval: 15s
      path: /stats/prometheus
