apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: rate-limiter
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      app: istio-ingressgateway
      istio: ai-gateway
  configPatches:
    - applyTo: CLUSTER
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: counter-service
          type: STRICT_DNS
          connect_timeout: 1s
          load_assignment:
            cluster_name: counter-service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: counter-service.default.svc.cluster.local
                          port_value: 8080
    - applyTo: EXTENSION_CONFIG
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: rate-limiter-wasm
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
            config:
              name: rate-limiter-wasm
              root_id: rate-limiter-root
              fail_open: true
              vm_config:
                vm_id: rate-limiter-vm
                runtime: envoy.wasm.runtime.v8
                # ECDS 使用透传默认配置；禁止向请求暴露尚未下载完成的 VM。
                nack_on_code_cache_miss: true
                code:
                  remote:
                    http_uri:
                      uri: http://counter-service.default.svc.cluster.local:8080/wasm/rate-limiter.wasm
                      cluster: counter-service
                      timeout: 10s
                    sha256: 3825ae4155acefcb193a904f32eb188ca954d9aa90dcd43e13aa59f19a606e4e
              configuration:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: |
                  distributed_limit:
                    enabled: true
                    backend: counter_service
                    counter_service:
                      cluster: counter-service
                      acquire_path: /acquire
                      release_path: /release
                      renew_path: /renew
                      timeout_ms: 5000
                      lease_ttl_ms: 30000
                  error_response:
                    status_code: 429
                    message: Rate limit exceeded
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: rate-limiter-wasm
          config_discovery:
            config_source:
              ads: {}
            # 插件尚未就绪或配置被拒绝时，监听器立即使用透传过滤器。
            apply_default_config_without_warming: true
            default_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              inline_code: "function envoy_on_request(handle) end"
            type_urls:
              - type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
              - type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
