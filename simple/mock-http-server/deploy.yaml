# 本地 kind-kind 模拟服务，复用 istio-system/istio-ingressgateway。
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-http-server
  namespace: default
data:
  mock_http_server.py: |
    #!/usr/bin/env python3
    """模拟慢 HTTP 服务：等待指定时间后返回 OK，仅使用 Python 标准库。"""
    
    import argparse
    import math
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    
    
    def nonnegative_seconds(value):
        seconds = float(value)
        if not math.isfinite(seconds) or seconds < 0:
            raise argparse.ArgumentTypeError("等待时间必须是有限的非负数")
        return seconds
    
    
    def main():
        parser = argparse.ArgumentParser(description=__doc__)
        parser.add_argument("--host", default="0.0.0.0", help="监听地址（默认：0.0.0.0）")
        parser.add_argument("--port", type=int, default=8080, help="监听端口（默认：8080）")
        parser.add_argument("--delay", type=nonnegative_seconds, default=10, help="响应前等待秒数（默认：10，支持小数）")
        args = parser.parse_args()
        if not 0 <= args.port <= 65535:
            parser.error("端口必须在 0 到 65535 之间")
    
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                time.sleep(args.delay)
                body = b"OK"
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                try:
                    self.wfile.write(body)
                except (BrokenPipeError, ConnectionResetError):
                    # 测试客户端可能在等待期间主动超时断开。
                    pass
    
            do_POST = do_GET
    
        with ThreadingHTTPServer((args.host, args.port), Handler) as server:
            print(f"监听 {args.host}:{server.server_port}，每次请求等待 {args.delay:g} 秒后返回 OK", flush=True)
            try:
                server.serve_forever()
            except KeyboardInterrupt:
                pass
    
    
    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-http-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-http-server
  template:
    metadata:
      labels:
        app: mock-http-server
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: server
          image: python:3.10-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/app/mock_http_server.py"]
          args: ["--host", "0.0.0.0", "--port", "8080", "--delay", "10"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: mock-http-server
---
apiVersion: v1
kind: Service
metadata:
  name: mock-http-server
  namespace: default
spec:
  selector:
    app: mock-http-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: mock-http-server
  namespace: default
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http-mock
        protocol: HTTP
      hosts:
        - mock-http-server.local
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: mock-http-server
  namespace: default
spec:
  host: mock-http-server.default.svc.cluster.local
  subsets:
    - name: current-pod
      labels:
        app: mock-http-server
        pod-template-hash: 5658c678b
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mock-http-server
  namespace: default
spec:
  hosts:
    - mock-http-server.local
  gateways:
    - mock-http-server
  http:
    - timeout: 300s
      route:
        - destination:
            host: mock-http-server.default.svc.cluster.local
            subset: current-pod
            port:
              number: 8080
